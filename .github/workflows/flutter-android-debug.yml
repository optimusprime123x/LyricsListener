name: Build debug APK

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Cache Android SDK licenses
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/licenses
          key: ${{ runner.os }}-android-licenses-v1

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Prepare release metadata
        id: release_meta
        if: github.event_name == 'push'
        run: |
          message_lower="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH" | tr '[:upper:]' '[:lower:]')"
          if [[ "$message_lower" =~ (^|[^[:alnum:]_])(release|stable)($|[^[:alnum:]_]) ]]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_timestamp=$(date -u +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: github.event_name == 'push' && steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-debug-${{ steps.release_meta.outputs.release_timestamp }}
          name: Debug APK ${{ steps.release_meta.outputs.release_timestamp }}
          target_commitish: ${{ github.sha }}
          files: build/app/outputs/flutter-apk/app-debug.apk
